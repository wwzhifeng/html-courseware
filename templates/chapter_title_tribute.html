<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>章节标题 · 致敬原作</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Noto+Serif+SC:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #0a0806;
  --gold-primary: #d4a857;
  --gold-bright: #f4cf7a;
  --gold-deep: #8a6a2e;
  --gold-glow: rgba(212, 168, 87, 0.5);
  --ink-primary: #ede4d0;
  --ink-muted: #8a8378;
  --ink-faint: #4a4640;
  --line: rgba(212, 168, 87, 0.2);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg-base);
  color: var(--ink-primary);
  font-family: 'Noto Serif SC', serif;
  overflow: hidden;
}

#stage {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 1920px;
  height: 1080px;
  transform-origin: center center;
  background: var(--bg-base);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 背景光晕 */
#stage::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 50% 45%, rgba(212, 168, 87, 0.1), transparent 70%);
  pointer-events: none;
  z-index: 1;
}

/* 颗粒纹理 */
#stage::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  opacity: 0.08;
  mix-blend-mode: overlay;
  pointer-events: none;
  z-index: 100;
}

.center {
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* 顶部小标 */
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  letter-spacing: 0.5em;
  color: var(--gold-primary);
  text-transform: uppercase;
  margin-bottom: 48px;
  opacity: 0;
  animation: fadeIn 0.8s ease forwards;
  animation-delay: 0.3s;
}
.eyebrow .deco { color: var(--gold-deep); margin: 0 24px; }

/* 主标题:打字容器 */
.typewriter {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 160px;
}

.typed-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 88px;
  font-weight: 700;
  color: var(--ink-primary);
  letter-spacing: 0.04em;
  white-space: nowrap;
}
/* 英文部分用衬线斜体,中英混排更精致 */
.typed-text .en {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: var(--gold-bright);
}

/* 闪烁光标 */
.cursor {
  display: inline-block;
  width: 6px;
  height: 74px;
  background: var(--gold-bright);
  margin-left: 16px;
  box-shadow: 0 0 24px var(--gold-glow);
  animation: blink 0.7s step-end infinite;
  vertical-align: middle;
}

/* 英文副标 */
.subtitle-en {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 52px;
  font-weight: 500;
  color: var(--gold-primary);
  letter-spacing: 0.06em;
  margin-top: 40px;
  opacity: 0;
  animation: fadeIn 1s ease forwards;
}

/* 装饰分隔 */
.deco-line {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 56px;
  opacity: 0;
  animation: fadeIn 1s ease forwards;
}
.deco-line .line {
  width: 120px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
}
.deco-line .dot { color: var(--gold-primary); font-size: 22px; }

@keyframes blink { 50% { opacity: 0; } }
@keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div id="stage">
  <div class="center">
    <div class="eyebrow"><span class="deco">—</span>TRIBUTE<span class="deco">·</span>致敬原作<span class="deco">—</span></div>

    <div class="typewriter">
      <span class="typed-text" id="typed"></span><span class="cursor"></span>
    </div>

    <div class="deco-line" id="decoLine">
      <div class="line"></div>
      <span class="dot">◆</span>
      <div class="line"></div>
    </div>
  </div>
</div>

<script>
// 自适应缩放
function fitScale() {
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('stage').style.transform =
    `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener('resize', fitScale);
fitScale();

// 打字机效果
const fullText = '致敬原作 · Deep-Live-Cam';   // ← 改这里换标题文字
const typed = document.getElementById('typed');
const decoLine = document.getElementById('decoLine');

const splitIdx = fullText.indexOf('·');  // 分隔点位置
let i = 0;
function type() {
  if (i < fullText.length) {
    const shown = fullText.slice(0, i + 1);
    // 分隔点之后的英文部分套金色斜体
    if (shown.includes('·')) {
      const parts = shown.split('·');
      typed.innerHTML = parts[0] + '·<span class="en">' + parts[1] + '</span>';
    } else {
      typed.textContent = shown;
    }
    i++;
    setTimeout(type, 200);   // ← 改这里调打字速度(毫秒/字)
  } else {
    setTimeout(() => {
      decoLine.style.animation = 'fadeIn 1s ease 0.3s forwards';
    }, 300);
  }
}
// 延迟 1 秒开始打字(等小标先出现)
setTimeout(type, 1000);
</script>
</body>
</html>
